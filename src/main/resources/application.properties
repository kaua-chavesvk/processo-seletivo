spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/selecao}
spring.datasource.username=${POSTGRES_USER:selecao}
spring.datasource.password=${POSTGRES_PASSWORD:selecao}
spring.jpa.hibernate.ddl-auto=validate
server.address=127.0.0.1
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-stacktrace=never
app.uploads=${UPLOADS_DIR:./uploads}
app.jwt=${JWT_SECRET:}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
