name: Verificar plataforma
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B verify dependency:tree -Dscope=runtime -DoutputFile=target/runtime-tree.txt
      - run: python3 scripts/auditar_dependencias.py target/runtime-tree.txt --ci
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Compilar e testar a interface
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run build
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npm test -- demo.spec.ts
      - run: docker compose config --quiet
      - name: Verificar a imagem com um processo seletivo por HTTP
        env:
          TESTAR_INTERFACE: "true"
        run: python3 scripts/demonstrar.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura
          path: target/site/jacoco
