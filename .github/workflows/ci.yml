name: Verificar API
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: target/site/jacoco
