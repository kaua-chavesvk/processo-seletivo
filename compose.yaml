services:
  db:
    restart: unless-stopped
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_DB: selecao
      POSTGRES_USER: selecao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selecao}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selecao -d selecao"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r protocolo codigo restante <&3
          [[ "$$protocolo" == HTTP/* && "$$codigo" == 200 ]]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/selecao
      SERVER_ADDRESS: 0.0.0.0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selecao}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_PROXIES_CONFIAVEIS: ${APP_PROXIES_CONFIAVEIS:-}
      APP_ACCESS_TTL: ${APP_ACCESS_TTL:-15m}
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - curriculos:/app/uploads
volumes:
  dados:
  curriculos:
